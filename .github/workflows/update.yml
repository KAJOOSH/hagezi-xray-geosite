name: Update GeoSite

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-geosite
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build candidate GeoData
        run: go run -mod=readonly ./cmd/geosite

      - name: Run Xray integration tests
        id: xray
        run: python3 -B tests/xray-core/run.py --report-dir test-results

      - name: Upload Xray integration report
        if: always() && steps.xray.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xray-integration-${{ github.run_attempt }}
          path: |
            test-results/report.json
            test-results/report.md
          if-no-files-found: warn

      - name: Publish versioned GeoSite
        if: steps.xray.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish.sh dist test-results/report.json
